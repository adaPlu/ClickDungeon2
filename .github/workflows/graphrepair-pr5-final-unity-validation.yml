name: GraphRepair PR5 Final Unity Validation

on:
  push:
    branches:
      - feature/visual-remaster-production

permissions:
  contents: read
  checks: write

jobs:
  production-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate production contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python scripts/validate-content.py
          python scripts/validate-replay.py
          python scripts/validate-assets.py
          python scripts/validate-gameplay-art-bindings.py
          python scripts/static-audit.py
          python scripts/test-validators.py
          python scripts/validate-unity-metadata.py --strict
          grep -F 'm_EditorVersion: 6000.5.9f1' ProjectSettings/ProjectVersion.txt
      - name: Require Unity activation inputs
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo '::error::Unity email/password secrets are required for final PR5 validation.'
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo '::error::UNITY_LICENSE or UNITY_SERIAL is required for final PR5 validation.'
            exit 1
          fi

  editmode:
    needs: production-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Require idempotent Unity import
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-unity-metadata.py --strict
          report="$RUNNER_TEMP/pr5-unity-mutation-report.txt"
          {
            echo '=== git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages ==='
            git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages || true
            echo
            echo '=== git diff --name-status -- Assets ProjectSettings Packages ==='
            git diff --name-status -- Assets ProjectSettings Packages || true
            echo
            echo '=== git diff --no-ext-diff -- Assets ProjectSettings Packages ==='
            git diff --no-ext-diff -- Assets ProjectSettings Packages || true
          } > "$report"
          delta="$(git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages)"
          if [ -n "$delta" ]; then
            echo '::error::Unity EditMode/import mutated tracked project inputs.'
            cat "$report"
            exit 1
          fi
      - name: Upload Unity mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-unity-mutation-report
          path: ${{ runner.temp }}/pr5-unity-mutation-report.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-final-editmode-results
          path: test-artifacts
          if-no-files-found: ignore

  windows-build:
    needs: editmode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build Windows through ClickDungeon BuildAutomation
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          targetPlatform: StandaloneWindows64
          buildMethod: ClickDungeon.EditorTools.BuildAutomation.BuildWindows
          allowDirtyBuild: false
      - name: Inspect Windows production artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inspect-build-artifact.py windows Builds/Windows
      - name: Require idempotent production build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-unity-metadata.py --strict
          delta="$(git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages)"
          if [ -n "$delta" ]; then
            echo '::error::Production build mutated tracked project inputs.'
            printf '%s\n' "$delta"
            git diff --no-ext-diff -- Assets ProjectSettings Packages || true
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr5-final-windows-player
          path: Builds/Windows
          if-no-files-found: error

  runtime-smoke:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr5-final-windows-player
          path: Builds/Windows
      - name: Launch and verify built Windows player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $PWD 'runtime-smoke-results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $logPath = Join-Path $results 'player.log'
          $exe = Get-ChildItem -Path 'Builds/Windows' -Filter '*.exe' -File -Recurse |
            Where-Object { $_.Name -notmatch '^UnityCrashHandler' } |
            Select-Object -First 1
          if ($null -eq $exe) { throw 'ClickDungeon2 Windows executable was not found.' }
          $arguments = "-batchmode -nographics -logFile `"$logPath`" -cd2RuntimeSmoke"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(70)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 1
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $logPath) { Get-Content $logPath }
            throw 'Built Windows player did not complete runtime smoke within 70 seconds.'
          }
          $exitCode = $process.ExitCode
          if (-not (Test-Path $logPath)) { throw "Built player exited with code $exitCode but did not produce player.log." }
          $logText = Get-Content -Raw $logPath
          Get-Content $logPath
          if ($exitCode -ne 0) { throw "Runtime smoke exited with code $exitCode." }
          if ($logText.Contains('[CD2_RUNTIME_SMOKE] FAIL')) { throw 'Built player emitted explicit runtime-smoke failure.' }
          $requiredMarkers = @(
            '[CD2_RUNTIME_SMOKE] START',
            '[CD2_RUNTIME_SMOKE] SCENE Boot',
            '[CD2_RUNTIME_SMOKE] SCENE Main',
            '[CD2_RUNTIME_SMOKE] MAIN_READY',
            '[CD2_RUNTIME_SMOKE] SCENE Game',
            '[CD2_RUNTIME_SMOKE] GAME_READY',
            '[CD2_RUNTIME_SMOKE] PASS'
          )
          foreach ($marker in $requiredMarkers) {
            if (-not $logText.Contains($marker)) { throw "Required runtime marker missing: $marker" }
          }
          Write-Host 'Built Windows player proved Boot -> Main -> Game and initialized GameBootstrap successfully.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-final-runtime-smoke-results
          path: runtime-smoke-results
          if-no-files-found: ignore