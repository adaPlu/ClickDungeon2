name: Unity CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-ci.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.5.9f1

jobs:
  preflight:
    name: Unity CI preflight
    runs-on: ubuntu-latest
    outputs:
      license_ready: ${{ steps.license.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Verify Unity project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -d Assets/ClickDungeon
          grep -F 'm_EditorVersion: 6000.5.9f1' ProjectSettings/ProjectVersion.txt

      - name: Check Unity license secrets
        id: license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name GitHub Actions secret is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Unity project source is present, but GameCI licensing is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'GameCI license secrets are configured.' >> "$GITHUB_STEP_SUMMARY"

  editmode-tests:
    name: Unity EditMode tests
    needs: preflight
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ClickDungeon2 EditMode Tests

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: test-artifacts
          if-no-files-found: warn

  windows-build:
    name: Windows player build
    needs: editmode-tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClickDungeon2-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
