name: Bootstrap ClickDungeon2 Source

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'bootstrap/source.part*'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify bootstrap chunks
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07; do
            test -s "bootstrap/source.part${n}"
          done
          echo "Verified source chunks 00-07"

      - name: Recover verified source archive prefix
        shell: bash
        run: |
          set -euo pipefail
          cat \
            bootstrap/source.part00 \
            bootstrap/source.part01 \
            bootstrap/source.part02 \
            bootstrap/source.part03 \
            bootstrap/source.part04 \
            bootstrap/source.part05 \
            bootstrap/source.part06 \
            bootstrap/source.part07 \
            > /tmp/source-prefix.b64
          base64 -d /tmp/source-prefix.b64 > /tmp/source-prefix.zip

          # source-prefix.zip is intentionally truncated before the damaged transfer tail.
          # zip -FF reconstructs a central directory from complete local file records.
          mkdir -p /tmp/recovered
          zip -FF /tmp/source-prefix.zip --out /tmp/source-recovered.zip </dev/null || true
          unzip -t /tmp/source-recovered.zip
          unzip -o /tmp/source-recovered.zip -d /tmp/recovered
          cp -a /tmp/recovered/. .

      - name: Inventory recovered project
        shell: bash
        run: |
          set -euo pipefail
          echo "Recovered files: $(find Assets Packages ProjectSettings docs scripts -type f 2>/dev/null | wc -l)"
          test -f Assets/ClickDungeon/Simulation/GameSession.cs
          test -f Assets/ClickDungeon/Simulation/Content/GameContent.cs
          test -f Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          test -f Assets/ClickDungeon/Editor/ContentValidator.cs
          test -f Packages/manifest.json
          test -f ProjectSettings/ProjectVersion.txt

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No expansion changes"
            exit 0
          fi
          git commit -m "chore: expand repaired ClickDungeon2 source"
          git push origin HEAD:develop
