name: PR Bootstrap Verified Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.head_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/compile.b64
          for n in $(seq -w 0 36); do
            test -s "bootstrap2/part${n}"
            sha256sum "bootstrap2/part${n}"
            cat "bootstrap2/part${n}" >> /tmp/compile.b64
          done
          base64 -d /tmp/compile.b64 > /tmp/compile.zip
          echo "3e0277519d6b8c7510a3434118ac8b6f17e014e0c243feeb8b537ff874e4c7ee  /tmp/compile.zip" | sha256sum -c -
          unzip -t /tmp/compile.zip
          rm -rf /tmp/cd2expanded
          mkdir -p /tmp/cd2expanded
          unzip -o /tmp/compile.zip -d /tmp/cd2expanded
          cp -a /tmp/cd2expanded/. .

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          test -f Packages/manifest.json
          test -f ProjectSettings/ProjectVersion.txt
          test -f Assets/ClickDungeon/Simulation/GameSession.cs
          test -f Assets/ClickDungeon/Tests/EditMode/GameSessionTests.cs
          python -m compileall -q scripts
          python scripts/validate-content.py
          python scripts/static-audit.py

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap bootstrap2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: expand verified ClickDungeon2 source"
          git push origin HEAD:develop
