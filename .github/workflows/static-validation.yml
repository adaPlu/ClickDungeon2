name: Static Content Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m compileall -q scripts
      - name: Validate canonical content
        run: python scripts/validate-content.py
      - name: Run adversarial static audit
        run: python scripts/static-audit.py
      - name: Verify Unity editor pin
        run: grep -F 'm_EditorVersion: 6000.5.9f1' ProjectSettings/ProjectVersion.txt
