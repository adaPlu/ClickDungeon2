name: Static Content Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m compileall -q scripts
      - name: Validate canonical content
        run: python scripts/validate-content.py
      - name: Validate replay contracts
        run: python scripts/validate-replay.py
      - name: Run adversarial static audit
        run: python scripts/static-audit.py
      - name: Run validator fixture tests
        run: python scripts/test-validators.py
      - name: Verify Unity editor pin
        run: grep -F 'm_EditorVersion: 6000.5.9f1' ProjectSettings/ProjectVersion.txt
