name: PR Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repository state
        shell: bash
        run: |
          echo "Head: $GITHUB_SHA"
          echo "Files: $(find . -type f | wc -l)"
          test -f Packages/manifest.json && echo "manifest: present" || echo "manifest: missing"
          test -f ProjectSettings/ProjectVersion.txt && echo "project-version: present" || echo "project-version: missing"
          test -f Assets/ClickDungeon/Simulation/GameSession.cs && echo "simulation-source: present" || echo "simulation-source: missing"
          test -f Assets/ClickDungeon/Tests/EditMode/GameSessionTests.cs && echo "editmode-tests: present" || echo "editmode-tests: missing"
      - name: Unity secret preflight
        run: echo "Unity secret checks are intentionally skipped on pull_request workflows."
