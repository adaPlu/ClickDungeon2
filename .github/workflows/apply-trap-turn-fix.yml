name: Apply Trap Kit Turn Fix

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-trap-turn-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Make trap-kit use obey enemy reaction rules
        shell: python
        run: |
          from pathlib import Path
          p=Path('Assets/ClickDungeon/Simulation/GameSession.cs')
          s=p.read_text()
          old='State.InventoryItemIds.RemoveAt(inventoryIndex);ResolveTile(trapTile);events.Add(new GameEvent("trap.disarmed",targetTileIndex,trapTile.ContentId));GainRecharge(1,events);return CommandResult.Accept(events);'
          new='State.InventoryItemIds.RemoveAt(inventoryIndex);ResolveTile(trapTile);events.Add(new GameEvent("trap.disarmed",targetTileIndex,trapTile.ContentId));GainRecharge(1,events);var enemy=FirstAdjacentMonster();if(enemy>=0)MonsterIntentResolver.Resolve(State,State.Tiles[enemy],_content,events);return CommandResult.Accept(events);'
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('trap-kit resolution insertion point changed')
          p.write_text(s.replace(old,new,1))
      - name: Verify and commit
        run: |
          grep -F 'trap.disarmed' Assets/ClickDungeon/Simulation/GameSession.cs
          grep -F 'var enemy=FirstAdjacentMonster();if(enemy>=0)MonsterIntentResolver.Resolve' Assets/ClickDungeon/Simulation/GameSession.cs
          if git diff --quiet; then exit 0; fi
          git config user.name 'ClickDungeon CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Assets/ClickDungeon/Simulation/GameSession.cs
          git commit -m 'fix(economy): make trap kit consume a combat turn'
          git push origin HEAD:develop
