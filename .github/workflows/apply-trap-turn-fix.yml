name: Apply Trap Kit Compile Repair

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-trap-turn-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Repair trap-kit local declaration collision
        shell: python
        run: |
          from pathlib import Path
          p=Path('Assets/ClickDungeon/Simulation/GameSession.cs')
          s=p.read_text()
          old='GainRecharge(1,events);var enemy=FirstAdjacentMonster();if(enemy>=0)MonsterIntentResolver.Resolve(State,State.Tiles[enemy],_content,events);return CommandResult.Accept(events);'
          new='GainRecharge(1,events);var reactingEnemy=FirstAdjacentMonster();if(reactingEnemy>=0)MonsterIntentResolver.Resolve(State,State.Tiles[reactingEnemy],_content,events);return CommandResult.Accept(events);'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('trap-kit reaction insertion point changed')
          p.write_text(s)
      - name: Verify, remove one-shot workflow, and commit
        run: |
          set -euo pipefail
          grep -F 'var reactingEnemy=FirstAdjacentMonster();if(reactingEnemy>=0)' Assets/ClickDungeon/Simulation/GameSession.cs
          git config user.name 'ClickDungeon CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-trap-turn-fix.yml
          git add Assets/ClickDungeon/Simulation/GameSession.cs
          git commit -m 'fix(economy): repair trap-kit enemy reaction compile error'
          git push origin HEAD:develop
