name: Apply Economy UI Fix

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-economy-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch RuntimeGameUI economy and trap-kit flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs')
          s=p.read_text()

          if 'private string _pendingItemId;' not in s:
              old='        private string _pendingAbilityId;\n'
              new='        private string _pendingAbilityId;\n        private string _pendingItemId;\n'
              if old not in s: raise SystemExit('pending field insertion point changed')
              s=s.replace(old,new,1)

          old='            if(!string.IsNullOrEmpty(_pendingAbilityId)){string id=_pendingAbilityId;_pendingAbilityId=null;Apply(new UseAbilityCommand(id,index));return;}\n'
          if old in s and 'UseItemCommand(id,index)' not in s:
              new='            if(!string.IsNullOrEmpty(_pendingItemId)){string id=_pendingItemId;_pendingItemId=null;Apply(new UseItemCommand(id,index));return;}\n'+old
              s=s.replace(old,new,1)

          old='var defend=CreateButton("Defend",_abilityBar,"Defend",16);defend.onClick.AddListener(()=>Apply(new DefendCommand()));var potion=CreateButton("Potion",_abilityBar,"Potion",16);potion.interactable=_session.State.InventoryItemIds.Contains("item.healing_potion");potion.onClick.AddListener(()=>Apply(new UseItemCommand("item.healing_potion")));var gear=CreateButton("Gear",_abilityBar,"Gear",16);gear.onClick.AddListener(ShowInventory);'
          if old in s and 'Trap Kit' not in s:
              new='var defend=CreateButton("Defend",_abilityBar,"Defend",16);defend.onClick.AddListener(()=>Apply(new DefendCommand()));var potion=CreateButton("Potion",_abilityBar,"Potion",16);potion.interactable=_session.State.InventoryItemIds.Contains("item.healing_potion");potion.onClick.AddListener(()=>Apply(new UseItemCommand("item.healing_potion")));var trapKit=CreateButton("Trap Kit",_abilityBar,"Trap Kit",16);trapKit.interactable=_session.State.InventoryItemIds.Contains("item.trap_disarm_kit");trapKit.onClick.AddListener(()=>BeginItem("item.trap_disarm_kit"));var gear=CreateButton("Gear",_abilityBar,"Gear",16);gear.onClick.AddListener(ShowInventory);'
              s=s.replace(old,new,1)

          marker='        private void BeginAbility(string id)\n'
          if 'private void BeginItem(string id)' not in s:
              method='        private void BeginItem(string id)\n        {\n            _pendingItemId=id;\n            _pendingAbilityId=null;\n            _status.text=id=="item.trap_disarm_kit"?"Select an adjacent identified or revealed trap to disarm.":"Select a target.";\n        }\n\n'
              if marker not in s: raise SystemExit('BeginAbility marker changed')
              s=s.replace(marker,method+marker,1)

          start='        private void ShowMerchant(int tileIndex){ClearChoicePanel();_choicePanel.gameObject.SetActive(true);AddChoice("Potion 12g",()=>ApplyAndClose(new BuyItemCommand(tileIndex,"item.healing_potion")));AddChoice("Sword 25g",()=>ApplyAndClose(new BuyItemCommand(tileIndex,"item.rusty_sword")));AddChoice("Armor 25g",()=>ApplyAndClose(new BuyItemCommand(tileIndex,"item.leather_armor")));}\n'
          if start in s:
              repl='        private void ShowMerchant(int tileIndex)\n        {\n            ClearChoicePanel();_choicePanel.gameObject.SetActive(true);\n            var tile=_session.State.Tiles[tileIndex];string shopId=tile.ContentId=="merchant.standard"?"shop.standard":tile.ContentId.Replace("merchant.","shop.");var shop=_content.Shop(shopId);\n            foreach(var stockId in shop.StockItemIds){var def=_content.Item(stockId);string id=stockId;string display=string.IsNullOrEmpty(def.DisplayName)?ShortId(stockId):def.DisplayName;AddChoice($"{display} {def.Price}g",()=>ApplyAndClose(new BuyItemCommand(tileIndex,id)));}\n        }\n'
              s=s.replace(start,repl,1)

          if 'case "item.target_required"' not in s:
              old='                case "item.not_owned":return "That item is not in this run\'s inventory.";\n'
              new=old+'                case "item.target_required":return "Select a valid target for that item.";\n                case "trap.not_disarmable":return "The Trap Disarm Kit only works on an adjacent identified or revealed unresolved trap.";\n'
              if old not in s: raise SystemExit('rejection insertion point changed')
              s=s.replace(old,new,1)

          if 'case "trap.disarmed"' not in s:
              old='case "trap.triggered":return $"Trap! Lost {evt.Amount} HP.";'
              new=old+'case "trap.disarmed":return "Trap safely disarmed.";'
              if old not in s: raise SystemExit('event insertion point changed')
              s=s.replace(old,new,1)

          p.write_text(s)
      - name: Verify patch
        run: |
          grep -F 'private string _pendingItemId;' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          grep -F 'UseItemCommand(id,index)' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          grep -F 'Trap Kit' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          grep -F 'foreach(var stockId in shop.StockItemIds)' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          grep -F 'trap.not_disarmable' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'ClickDungeon CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          git commit -m 'fix(economy): expose canonical merchant stock and trap kit targeting'
          git push origin HEAD:develop
