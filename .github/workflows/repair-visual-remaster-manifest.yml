name: One-shot visual remaster manifest repair

on:
  push:
    branches:
      - feature/visual-remaster-production
    paths:
      - .github/workflows/repair-visual-remaster-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-remaster-manifest-repair
  cancel-in-progress: false

jobs:
  repair-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out visual remaster branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/visual-remaster-production
          fetch-depth: 0

      - name: Reconcile candidate runtime art into canonical provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path.cwd()
          runtime = root / 'Assets' / 'ClickDungeon' / 'Art' / 'Runtime'
          manifest_path = root / 'Assets' / 'ClickDungeon' / 'Art' / 'Source' / 'asset_manifest.json'

          heroes = [
              'ironheart', 'clickington', 'shadowcut', 'emberwisp', 'windsong',
              'lightbringer', 'rageclaw', 'gearspark', 'dawnward'
          ]
          hero_variants = [
              'master', 'portrait', 'roster', 'gameplay', 'idle', 'attack',
              'hit', 'victory', 'defeat'
          ]
          families = [
              ('boss', 'goblin_brute_king'),
              ('monster', 'crowned_slime'),
              ('monster', 'skeleton_warrior'),
              ('boss', 'bat_swarm_leader'),
              ('monster', 'mimic_chest'),
              ('monster', 'fire_imp'),
              ('monster', 'armored_boar'),
              ('monster', 'spooky_spellbook'),
              ('monster', 'cave_spider'),
              ('boss', 'theater_curtain_demon'),
          ]
          monster_variants = [
              'master', 'portrait', 'roster', 'gameplay', 'spawn', 'idle',
              'attack', 'hit', 'victory', 'defeat'
          ]
          extras = [
              'dungeon_floor_stone.png',
              'dungeon_stair_down.png',
              'dungeon_stair_down_locked.png',
              'dungeon_stair_up.png',
              'dungeon_stair_up_locked.png',
              'trap_bomb.png',
              'trap_pitfall.png',
              'trap_spikes.png',
          ]

          expected = []
          for hero in heroes:
              expected.extend(f'hero_{hero}_{variant}.png' for variant in hero_variants)
          for prefix, family in families:
              expected.extend(f'{prefix}_{family}_{variant}.png' for variant in monster_variants)
          expected.append('iron_sword.png')
          expected.extend(extras)

          if len(expected) != 190 or len(set(expected)) != 190:
              raise SystemExit(f'candidate expectation invariant failed: {len(expected)} names / {len(set(expected))} unique')

          missing = [name for name in expected if not (runtime / name).is_file()]
          missing_meta = [name + '.meta' for name in expected if not (runtime / (name + '.meta')).is_file()]
          if missing or missing_meta:
              raise SystemExit('landed candidate payload incomplete:\nmissing png=' + repr(missing) + '\nmissing meta=' + repr(missing_meta))

          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          rows = data.get('assets')
          if not isinstance(rows, list):
              raise SystemExit('asset_manifest.json has no assets array')

          by_file = {}
          ids = set()
          for row in rows:
              filename = row.get('filename')
              asset_id = row.get('asset_id')
              if filename:
                  if filename in by_file:
                      raise SystemExit(f'duplicate manifest filename before repair: {filename}')
                  by_file[filename] = row
              if asset_id:
                  if asset_id in ids:
                      raise SystemExit(f'duplicate manifest asset_id before repair: {asset_id}')
                  ids.add(asset_id)

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def asset_id_for(name: str) -> str:
              stem = name[:-4]
              if stem.startswith('hero_'):
                  body = stem[len('hero_'):]
                  for variant in hero_variants:
                      suffix = '_' + variant
                      if body.endswith(suffix):
                          return 'art.hero.' + body[:-len(suffix)] + '.' + variant
              for prefix in ('monster_', 'boss_'):
                  if stem.startswith(prefix):
                      body = stem[len(prefix):]
                      for variant in monster_variants:
                          suffix = '_' + variant
                          if body.endswith(suffix):
                              kind = prefix[:-1]
                              return f'art.{kind}.' + body[:-len(suffix)] + '.' + variant
              special = {
                  'iron_sword.png': 'art.item.iron_sword',
                  'dungeon_floor_stone.png': 'art.dungeon.floor.stone',
                  'dungeon_stair_down.png': 'art.dungeon.stair.down',
                  'dungeon_stair_down_locked.png': 'art.dungeon.stair.down.locked',
                  'dungeon_stair_up.png': 'art.dungeon.stair.up',
                  'dungeon_stair_up_locked.png': 'art.dungeon.stair.up.locked',
                  'trap_bomb.png': 'art.trap.bomb',
                  'trap_pitfall.png': 'art.trap.pitfall',
                  'trap_spikes.png': 'art.trap.spikes',
              }
              try:
                  return special[name]
              except KeyError:
                  raise SystemExit(f'no provenance asset id mapping for {name}')

          candidate_prompt = (
              'verified ClickDungeon visual-remaster candidate production asset; '
              'restored from candidate bundle sha256 '
              '64d6af64cf5f45e3a6dc06cf1cfafac5b6e677f746d09cef0dae8ea75d8bf579'
          )
          candidate_terms = (
              'Original ClickDungeon project artwork from the verified visual-remaster candidate pack; '
              'no third-party stock media or trademarks.'
          )

          added = 0
          updated_hashes = 0
          for name in expected:
              sha = digest(runtime / name)
              if name in by_file:
                  row = by_file[name]
                  if row.get('sha256') != sha:
                      row['sha256'] = sha
                      updated_hashes += 1
                  continue

              asset_id = asset_id_for(name)
              if asset_id in ids:
                  raise SystemExit(f'new manifest asset_id collides with existing id: {asset_id}')
              row = {
                  'asset_id': asset_id,
                  'filename': name,
                  'prompt_ref': candidate_prompt,
                  'sha256': sha,
                  'status': 'production',
                  'usage_terms': candidate_terms,
              }
              rows.append(row)
              by_file[name] = row
              ids.add(asset_id)
              added += 1

          rows.sort(key=lambda row: (row.get('asset_id') or '', row.get('filename') or ''))
          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          if added != 187:
              raise SystemExit(f'expected to add exactly 187 candidate manifest rows, added {added}')
          if updated_hashes != 3:
              raise SystemExit(f'expected to reconcile exactly 3 existing candidate SHA-256 values, updated {updated_hashes}')

          print(f'Manifest reconciliation complete: added={added}, updated_hashes={updated_hashes}, candidate_files={len(expected)}')
          PY

      - name: Validate repaired provenance and project contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-assets.py
          python3 scripts/validate-gameplay-art-bindings.py
          python3 scripts/static-audit.py
          python3 scripts/test-validators.py
          python3 scripts/validate-unity-metadata.py

      - name: Commit repaired manifest and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Assets/ClickDungeon/Art/Source/asset_manifest.json
          git rm -- .github/workflows/repair-visual-remaster-manifest.yml
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No manifest repair changes to commit.'; exit 1; }
          git commit -m 'art: reconcile remaster runtime provenance manifest'
          git push origin HEAD:feature/visual-remaster-production
