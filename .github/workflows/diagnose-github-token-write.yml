name: Diagnose GitHub Token Write

on:
  push:
    branches:
      - feature/visual-remaster-production
    paths:
      - .github/workflows/diagnose-github-token-write.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-token-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/visual-remaster-production
          fetch-depth: 0
          persist-credentials: false

      - id: push
        name: Probe self-update of visual remaster branch
        shell: bash
        env:
          PROBE_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ci/github-token-write-probe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          {
            echo "branch=$(git branch --show-current)"
            echo "before=$(git rev-parse HEAD)"
            echo 'configured_extraheader_keys:'
            git config --show-origin --name-only --get-regexp '^http\..*\.extraheader$' || true
          } > .ci/github-token-write-probe/context.txt

          git commit --allow-empty -m 'ci: workflow token feature-branch self-push probe'
          echo "candidate=$(git rev-parse HEAD)" >> .ci/github-token-write-probe/context.txt

          basic_auth="$(printf 'x-access-token:%s' "$PROBE_PUSH_TOKEN" | base64 -w0)"
          set +e
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:feature/visual-remaster-production \
            > .ci/github-token-write-probe/push.log 2>&1
          rc=$?
          set -e

          echo "exit_code=$rc" >> .ci/github-token-write-probe/context.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat .ci/github-token-write-probe/push.log

      - name: Upload self-push diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-token-self-push-probe
          path: .ci/github-token-write-probe
          if-no-files-found: error

      - name: Fail if feature-branch self-push failed
        if: always()
        shell: bash
        env:
          PUSH_EXIT_CODE: ${{ steps.push.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${PUSH_EXIT_CODE:-missing}" != "0" ]; then
            echo "::error::Feature-branch self-push failed with exit code ${PUSH_EXIT_CODE:-missing}."
            exit 1
          fi
          echo '::notice::github.token successfully pushed a new commit directly to feature/visual-remaster-production.'
