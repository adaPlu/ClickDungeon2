name: Visual Remaster Unity Validation

on:
  push:
    branches:
      - feature/visual-remaster-production
    paths:
      - .github/workflows/visual-remaster-unity-validation.yml
      - Assets/ClickDungeon/Art/Runtime/**
      - Assets/ClickDungeon/Art/GeneratedAnimations/**
      - Assets/ClickDungeon/Art/Source/asset_manifest.json
      - Assets/ClickDungeon/Editor/**
      - Assets/ClickDungeon/Presentation/**
      - Assets/ClickDungeon/Tests/PresentationEditMode/**
      - Packages/**
      - ProjectSettings/**
      - scripts/validate-unity-metadata.py
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: visual-remaster-unity-validation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Check Unity license inputs
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          ready=false
          personal=false
          professional=false
          if [ -n "${UNITY_LICENSE:-}" ]; then
            trimmed="${UNITY_LICENSE#"${UNITY_LICENSE%%[![:space:]]*}"}"
            if [ "${#UNITY_LICENSE}" -ge 256 ] && [[ "$trimmed" == \<* ]]; then personal=true; fi
          fi
          if [ -n "${UNITY_SERIAL:-}" ]; then professional=true; fi
          if [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] && { [ "$personal" = true ] || [ "$professional" = true ]; }; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Unity validation license ready: $ready"
          if [ "$ready" != true ]; then
            echo "::error::Unity/GameCI licensing is not fully configured for this repository."
            exit 1
          fi

  unity-art-validation:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out visual remaster branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/visual-remaster-production
          fetch-depth: 0
          persist-credentials: true

      - name: Audit committed Unity metadata before import
        run: python3 scripts/validate-unity-metadata.py

      - name: Install temporary Unity art integration test
        shell: bash
        run: |
          set -euo pipefail
          test_dir='Assets/ClickDungeon/Tests/VisualRemasterImportEditMode'
          mkdir -p "$test_dir"
          cat > "$test_dir/ClickDungeon.Tests.VisualRemasterImportEditMode.asmdef" <<'EOF'
          {
            "name": "ClickDungeon.Tests.VisualRemasterImportEditMode",
            "references": [
              "ClickDungeon.Editor",
              "ClickDungeon.Presentation"
            ],
            "optionalUnityReferences": ["TestAssemblies"],
            "includePlatforms": ["Editor"],
            "autoReferenced": false
          }
          EOF
          cat > "$test_dir/VisualRemasterImportTests.cs" <<'EOF'
          #if UNITY_EDITOR
          using System.IO;
          using NUnit.Framework;
          using ClickDungeon.EditorTools;
          using ClickDungeon.Presentation.Assets;

          namespace ClickDungeon.Tests.VisualRemasterImportEditMode
          {
              public sealed class VisualRemasterImportTests
              {
                  [Test]
                  public void GeneratePresentationDatabase_ThenStrictProductionArtValidationPasses()
                  {
                      var database = PresentationAssetGenerator.Generate(false, true);
                      Assert.That(database, Is.Not.Null, "Presentation database was not generated.");

                      var report = ProductionArtValidator.BuildReport();
                      Assert.That(report.RequiredCount, Is.EqualTo(182));
                      Assert.That(report.PresentCount, Is.EqualTo(182));
                      Assert.That(report.MissingFiles, Is.Empty, report.ToMultilineString());
                      Assert.That(report.UnmappedFiles, Is.Empty, report.ToMultilineString());
                      Assert.That(report.NonSpriteFiles, Is.Empty, report.ToMultilineString());

                      foreach (string fileName in ProductionArtManifest.RequiredRuntimePngNames())
                      {
                          string id = PresentationAssetId.FromRuntimeArtFile(Path.GetFileNameWithoutExtension(fileName));
                          Assert.That(id, Is.Not.Null.And.Not.Empty, $"No presentation ID for {fileName}.");
                          Assert.That(database.SpriteFor(id), Is.Not.Null, $"Generated presentation database has no Sprite for {fileName} -> {id}.");
                      }

                      ProductionArtValidator.ValidateOrThrow();
                  }
              }
          }
          #endif
          EOF

      - name: Run Unity EditMode import, generation, and strict production-art validation
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          testMode: EditMode
          artifactsPath: visual-remaster-unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary test harness and inspect Unity delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Assets/ClickDungeon/Tests/VisualRemasterImportEditMode
          rm -f Assets/ClickDungeon/Tests/VisualRemasterImportEditMode.meta
          mkdir -p .ci/visual-remaster-unity

          git diff --no-ext-diff -- Packages > .ci/visual-remaster-unity/package-noise.diff || true
          package_paths="$(git diff --name-only -- Packages || true)"
          unexpected_package_paths="$(printf '%s\n' "$package_paths" | sed '/^$/d' | grep -Ev '^Packages/(manifest\.json|packages-lock\.json)$' || true)"
          if [ -n "$unexpected_package_paths" ]; then
            echo "::error::Unity changed unexpected package files:"
            printf '%s\n' "$unexpected_package_paths"
            exit 1
          fi
          git checkout -- Packages/manifest.json Packages/packages-lock.json

          git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages > .ci/visual-remaster-unity/status.txt || true
          git diff --no-ext-diff -- Assets ProjectSettings Packages > .ci/visual-remaster-unity/diff.txt || true
          python3 scripts/validate-unity-metadata.py > .ci/visual-remaster-unity/metadata-audit.txt 2>&1 || true
          cat .ci/visual-remaster-unity/status.txt

      - name: Reject unexpected Unity project mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all", "--", "Assets", "ProjectSettings", "Packages"],
              text=True,
          )
          runtime_meta = re.compile(r"^Assets/ClickDungeon/Art/Runtime/[^/]+\.png\.meta$")
          generated_animation = re.compile(r"^Assets/ClickDungeon/Art/GeneratedAnimations(?:/.*|\.meta)?$")
          generated_presentation = re.compile(r"^Assets/ClickDungeon/Presentation/Generated(?:/.*|\.meta)?$")
          errors = []
          canonical_meta = []

          for line in status.splitlines():
              code = line[:2]
              path = line[3:]
              if generated_animation.fullmatch(path) or generated_presentation.fullmatch(path):
                  continue
              if runtime_meta.fullmatch(path):
                  if code != " M":
                      errors.append(f"{code} {path}: runtime metadata reconciliation must be a tracked working-tree modification")
                  else:
                      canonical_meta.append(path)
                  continue
              errors.append(f"{code} {path}: outside deterministic generated output / runtime PNG metadata")

          guid_re = re.compile(r"^guid:\s*([0-9a-fA-F]+)\s*$", re.MULTILINE)
          for path in canonical_meta:
              before = subprocess.check_output(["git", "show", f"HEAD:{path}"], text=True)
              after = pathlib.Path(path).read_text(encoding="utf-8")
              before_guid = guid_re.search(before)
              after_guid = guid_re.search(after)
              if not before_guid or not after_guid:
                  errors.append(f"{path}: missing GUID before/after Unity reconciliation")
              elif before_guid.group(1).lower() != after_guid.group(1).lower():
                  errors.append(f"{path}: Unity reconciliation changed GUID {before_guid.group(1)} -> {after_guid.group(1)}")

          if errors:
              print("::error::Unexpected Unity project mutation(s) detected:")
              for error in errors:
                  print(error)
              sys.exit(1)

          print(f"Validated {len(canonical_meta)} tracked runtime PNG metadata reconciliation change(s); GUIDs preserved.")
          PY
          python3 scripts/validate-unity-metadata.py

      - name: Upload Unity validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-remaster-unity-validation
          path: |
            visual-remaster-unity-test-results
            .ci/visual-remaster-unity
          if-no-files-found: ignore

      - name: Commit deterministic reconciliation or finalize workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "::notice::Reconciliation branch=$(git branch --show-current) head=$(git rev-parse --short=12 HEAD)"

          runtime_meta_changes="$(git diff --name-only -- Assets/ClickDungeon/Art/Runtime | grep -E '\.png\.meta$' || true)"
          if [ -n "$runtime_meta_changes" ]; then
            git add -u -- Assets/ClickDungeon/Art/Runtime
            if [ -e Assets/ClickDungeon/Art/GeneratedAnimations ]; then
              git add -A -- Assets/ClickDungeon/Art/GeneratedAnimations
            fi
            if [ -e Assets/ClickDungeon/Art/GeneratedAnimations.meta ]; then
              git add -A -- Assets/ClickDungeon/Art/GeneratedAnimations.meta
            fi
            if [ -e Assets/ClickDungeon/Presentation/Generated ]; then
              git add -A -- Assets/ClickDungeon/Presentation/Generated
            fi
            if [ -e Assets/ClickDungeon/Presentation/Generated.meta ]; then
              git add -A -- Assets/ClickDungeon/Presentation/Generated.meta
            fi
            unexpected_staged="$(git diff --cached --name-only | grep -Ev '^(Assets/ClickDungeon/Art/Runtime/[^/]+\.png\.meta|Assets/ClickDungeon/Art/GeneratedAnimations(/.*|\.meta)|Assets/ClickDungeon/Presentation/Generated(/.*|\.meta))$' || true)"
            if [ -n "$unexpected_staged" ]; then
              echo "::error::Unexpected path staged during metadata reconciliation:"
              printf '%s\n' "$unexpected_staged"
              exit 1
            fi
            echo '::notice::Creating deterministic reconciliation commit.'
            git diff --cached --stat
            git commit -m 'art: canonicalize remaster Unity metadata and generated output'
            echo "::notice::Commit created at $(git rev-parse --short=12 HEAD); pushing to feature branch."
            git push origin HEAD:feature/visual-remaster-production
            echo '::notice::Deterministic reconciliation push completed.'
            echo 'Canonical Unity metadata and generated output committed. Workflow retained for an idempotence validation pass.'
            exit 0
          fi

          remaining_asset_changes="$(git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages || true)"
          if [ -n "$remaining_asset_changes" ]; then
            echo "::error::Unity generation is not idempotent after canonical reconciliation:"
            printf '%s\n' "$remaining_asset_changes"
            exit 1
          fi

          echo '::notice::Idempotence proven; staging temporary workflow removal only.'
          git rm -- .github/workflows/visual-remaster-unity-validation.yml
          unexpected_staged="$(git diff --cached --name-only | grep -Ev '^\.github/workflows/visual-remaster-unity-validation\.yml$' || true)"
          if [ -n "$unexpected_staged" ]; then
            echo "::error::Unexpected path staged during finalization:"
            printf '%s\n' "$unexpected_staged"
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'ci: finalize validated visual remaster import'
          echo "::notice::Finalization commit created at $(git rev-parse --short=12 HEAD); pushing to feature branch."
          git push origin HEAD:feature/visual-remaster-production
          echo '::notice::Finalization push completed.'
