name: Unity License Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-readiness:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check current GameCI Personal license setup
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          {
            echo '## Unity / GameCI license readiness'
            echo
            echo 'Current GameCI v4 Personal-license flow:'
            echo '1. Activate a free Personal license locally in Unity Hub.'
            echo '2. On Windows, locate C:\ProgramData\Unity\Unity_lic.ulf.'
            echo '3. Store the complete .ulf contents as repository secret UNITY_LICENSE.'
            echo '4. Store the Unity account email/password as UNITY_EMAIL and UNITY_PASSWORD.'
            echo '5. Re-run Unity Platform CI.'
            echo
            echo 'The old unity-request-activation-file action is no longer supported.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'Unity GameCI secrets are configured.' >> "$GITHUB_STEP_SUMMARY"
