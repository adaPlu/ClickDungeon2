name: Unity License Activation Request

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request Unity activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.5.9f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.5.9f1_Activation_Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error

      - name: Activation instructions
        shell: bash
        run: |
          {
            echo '## Unity GameCI activation'
            echo
            echo '1. Download the Unity_v6000.5.9f1_Activation_Request artifact (.alf).'
            echo '2. Complete Unity manual license activation for this request.'
            echo '3. Store the resulting license text as repository secret UNITY_LICENSE.'
            echo '4. Store the Unity account email/password as UNITY_EMAIL and UNITY_PASSWORD if required by the GameCI license method in use.'
            echo '5. Re-run Unity CI.'
          } >> "$GITHUB_STEP_SUMMARY"
