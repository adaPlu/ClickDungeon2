name: Application Compile Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  compile-and-test-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile Application with minimal Unity stubs and run persistence/replay/content tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/application
          cat > .ci/application/UnityEngineStubs.cs <<'EOF'
          using System;
          namespace UnityEngine
          {
              public class ScriptableObject { }
              [AttributeUsage(AttributeTargets.Class)] public sealed class CreateAssetMenuAttribute : Attribute { public string menuName; public string fileName; }
              [AttributeUsage(AttributeTargets.Field)] public sealed class SerializeField : Attribute { }
              [AttributeUsage(AttributeTargets.Field)] public sealed class TextAreaAttribute : Attribute { public TextAreaAttribute(int minLines,int maxLines) { } }
              public enum RuntimePlatform { WindowsPlayer, OSXPlayer, LinuxPlayer, WebGLPlayer, Android, IPhonePlayer }
              public static class Application
              {
                  public static bool isEditor => false;
                  public static RuntimePlatform platform => RuntimePlatform.WindowsPlayer;
                  public static bool isMobilePlatform => false;
                  public static string persistentDataPath => System.IO.Path.GetTempPath();
              }
              public static class PlayerPrefs
              {
                  public static int GetInt(string key,int defaultValue=0)=>defaultValue;
                  public static void SetInt(string key,int value) { }
                  public static void Save() { }
              }
              public static class Debug
              {
                  public static void Log(object message) { }
                  public static void LogWarning(object message) { }
                  public static void LogError(object message) { }
              }
          }
          EOF
          cat > .ci/application/ApplicationCompileTests.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
              <LangVersion>latest</LangVersion>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <IsTestProject>true</IsTestProject>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../../Assets/ClickDungeon/Simulation/**/*.cs" />
              <Compile Include="../../Assets/ClickDungeon/Application/**/*.cs" />
              <Compile Include="../../Assets/ClickDungeon/Tests/ApplicationEditMode/**/*.cs" Exclude="../../Assets/ClickDungeon/Tests/ApplicationEditMode/**/*.asmdef" />
              <Compile Include="UnityEngineStubs.cs" />
              <PackageReference Include="Newtonsoft.Json" Version="13.0.3" />
              <PackageReference Include="NUnit" Version="3.14.0" />
              <PackageReference Include="NUnit3TestAdapter" Version="4.6.0" />
              <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.11.1" />
            </ItemGroup>
          </Project>
          EOF
          dotnet test .ci/application/ApplicationCompileTests.csproj --configuration Release --nologo --logger "console;verbosity=normal"
      - name: Run canonical content, replay, asset provenance, adversarial, and validator-fixture validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python scripts/validate-content.py
          python scripts/validate-replay.py
          python scripts/validate-assets.py
          python scripts/validate-gameplay-art-bindings.py
          python scripts/static-audit.py
          python scripts/test-validators.py
          grep -F 'm_EditorVersion: 6000.5.9f1' ProjectSettings/ProjectVersion.txt
      - name: Task 6 strict Unity metadata and hero GUID snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-unity-metadata.py --strict
          mkdir -p .ci/hero-reconciliation
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root=Path('Assets/ClickDungeon/Art/Runtime')
          heroes=('ironheart','clickington','dawnward','rageclaw','gearspark','windsong','lightbringer','emberwisp','shadowcut')
          variants=('master','portrait','roster','gameplay','idle','attack','hit','victory','defeat')
          guid_re=re.compile(r'^guid:\s*([0-9a-fA-F]{32})\s*$',re.MULTILINE)
          rows=[]
          errors=[]
          for hero in heroes:
              for variant in variants:
                  png=root/f'hero_{hero}_{variant}.png'
                  meta=Path(str(png)+'.meta')
                  if not png.is_file():
                      errors.append(f'missing {png}')
                      continue
                  if not meta.is_file():
                      errors.append(f'missing {meta}')
                      continue
                  match=guid_re.search(meta.read_text(encoding='utf-8',errors='replace'))
                  if not match:
                      errors.append(f'invalid/missing GUID in {meta}')
                      continue
                  rows.append((png.as_posix(),match.group(1).lower()))
          if errors:
              raise SystemExit('\n'.join(errors))
          if len(rows)!=81:
              raise SystemExit(f'expected 81 hero GUID pairs, found {len(rows)}')
          guids=[guid for _,guid in rows]
          if len(set(guids))!=81:
              raise SystemExit('hero runtime metadata contains duplicate GUIDs')
          text='\n'.join(f'{path}\t{guid}' for path,guid in rows)+'\n'
          out=Path('.ci/hero-reconciliation/hero-guid-snapshot.txt')
          out.write_text(text,encoding='utf-8')
          digest=hashlib.sha256(text.encode('utf-8')).hexdigest()
          Path('.ci/hero-reconciliation/hero-guid-snapshot.sha256').write_text(digest+'\n',encoding='utf-8')
          print(f'HERO GUID SNAPSHOT PASSED: {len(rows)} files, {len(set(guids))} unique GUIDs')
          print(f'HERO GUID SNAPSHOT SHA256: {digest}')
          print(text,end='')
          PY
      - name: Upload Task 6 hero reconciliation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hero-reconciliation-evidence
          path: |
            .ci/hero-reconciliation
            Assets/ClickDungeon/Art/Runtime/hero_*_master.png
            Assets/ClickDungeon/Art/Runtime/hero_*_portrait.png
            Assets/ClickDungeon/Art/Runtime/hero_*_roster.png
            Assets/ClickDungeon/Art/Runtime/hero_*_gameplay.png
            Assets/ClickDungeon/Art/Runtime/hero_*_idle.png
            Assets/ClickDungeon/Art/Runtime/hero_*_attack.png
            Assets/ClickDungeon/Art/Runtime/hero_*_hit.png
            Assets/ClickDungeon/Art/Runtime/hero_*_victory.png
            Assets/ClickDungeon/Art/Runtime/hero_*_defeat.png
            Assets/ClickDungeon/Art/Runtime/hero_*_master.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_portrait.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_roster.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_gameplay.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_idle.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_attack.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_hit.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_victory.png.meta
            Assets/ClickDungeon/Art/Runtime/hero_*_defeat.png.meta
          if-no-files-found: error
