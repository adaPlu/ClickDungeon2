name: Hero Remaster Unity Validation

on:
  push:
    branches: [feature/hero-class-remaster-execution]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require usable Unity activation inputs
        shell: bash
        run: |
          set -euo pipefail
          credentials=false
          personal=false
          professional=false
          [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ] && credentials=true
          if [ -n "${UNITY_LICENSE:-}" ]; then
            trimmed="${UNITY_LICENSE#"${UNITY_LICENSE%%[![:space:]]*}"}"
            if [ "${#UNITY_LICENSE}" -ge 256 ] && [[ "$trimmed" == \<* ]]; then personal=true; fi
          fi
          [ -n "${UNITY_SERIAL:-}" ] && professional=true
          echo "Unity account credentials present: $credentials"
          echo "Personal .ulf shape ready: $personal"
          echo "Professional serial ready: $professional"
          if [ "$credentials" != true ] || { [ "$personal" != true ] && [ "$professional" != true ]; }; then
            echo "::error::Unity activation inputs are not ready; refusing to skip the required EditMode verification."
            exit 1
          fi
      - name: Strict metadata preflight
        run: python3 scripts/validate-unity-metadata.py --strict
      - name: Run Unity 6000.5.9f1 EditMode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          testMode: EditMode
          artifactsPath: hero-remaster-editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture and reconcile post-Unity mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/hero-remaster-unity"
          mkdir -p "$evidence"

          # Keep test output outside the repository so the final cleanliness check can cover the whole tree.
          if [ -d hero-remaster-editmode-results ]; then
            rm -rf "$evidence/hero-remaster-editmode-results"
            mv hero-remaster-editmode-results "$evidence/hero-remaster-editmode-results"
          fi

          # Preserve the exact pre-restore project mutation evidence.
          git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages > "$evidence/status.txt"
          git diff --no-ext-diff -- Assets ProjectSettings Packages > "$evidence/import.diff"
          metadata_rc=0
          python3 scripts/validate-unity-metadata.py --strict > "$evidence/metadata-audit.txt" 2>&1 || metadata_rc=$?

          unexpected=false
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              Packages/manifest.json|Packages/packages-lock.json)
                ;;
              *)
                echo "::error::Unexpected Unity mutation: $line"
                unexpected=true
                ;;
            esac
          done < "$evidence/status.txt"

          if [ "$unexpected" = true ]; then
            echo "::error::Unity EditMode verification mutated project state outside the two proven GameCI package files."
            exit 1
          fi

          if [ -s "$evidence/status.txt" ]; then
            echo "Only the two proven GameCI package-toolchain files changed; restoring them to HEAD."
            git restore --source=HEAD --staged --worktree -- Packages/manifest.json Packages/packages-lock.json
          fi

          # After removing CI output and restoring the only allowed environmental mutations, nothing may remain dirty anywhere.
          git status --porcelain=v1 --untracked-files=all > "$evidence/post-restore-status.txt"
          if [ -s "$evidence/post-restore-status.txt" ]; then
            echo "::error::Repository is not completely clean after GameCI package reconciliation."
            cat "$evidence/post-restore-status.txt"
            exit 1
          fi

          if [ "$metadata_rc" -ne 0 ]; then
            echo "::error::Strict Unity metadata audit failed after EditMode verification."
            cat "$evidence/metadata-audit.txt"
            exit "$metadata_rc"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hero-remaster-unity-evidence
          path: ${{ runner.temp }}/hero-remaster-unity
          if-no-files-found: ignore
