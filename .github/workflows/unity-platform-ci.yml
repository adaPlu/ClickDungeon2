name: Unity Platform CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      source_ready: ${{ steps.check.outputs.source_ready }}
      license_ready: ${{ steps.check.outputs.license_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check source and Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          source_ready=false
          license_ready=false
          if [ -f Packages/manifest.json ] && [ -f ProjectSettings/ProjectVersion.txt ] && [ -f Assets/ClickDungeon/Simulation/GameSession.cs ]; then
            source_ready=true
          fi
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            license_ready=true
          fi
          echo "source_ready=$source_ready" >> "$GITHUB_OUTPUT"
          echo "license_ready=$license_ready" >> "$GITHUB_OUTPUT"
          echo "Unity source ready: $source_ready"
          echo "Unity license secrets ready: $license_ready"

  editmode:
    needs: preflight
    if: needs.preflight.outputs.source_ready == 'true' && needs.preflight.outputs.license_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: test-artifacts
          if-no-files-found: ignore

  windows:
    needs: editmode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: ClickDungeon2
      - uses: actions/upload-artifact@v4
        with:
          name: ClickDungeon2-Windows
          path: build/StandaloneWindows64

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Android development APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildsPath: build
          buildName: ClickDungeon2
      - uses: actions/upload-artifact@v4
        with:
          name: ClickDungeon2-Android
          path: build/Android

  webgl:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build
          buildName: ClickDungeon2
      - uses: actions/upload-artifact@v4
        with:
          name: ClickDungeon2-WebGL
          path: build/WebGL
