name: Unity Platform CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      source_ready: ${{ steps.check.outputs.source_ready }}
      license_ready: ${{ steps.check.outputs.license_ready }}
      personal_license_shape_ready: ${{ steps.check.outputs.personal_license_shape_ready }}
      professional_license_ready: ${{ steps.check.outputs.professional_license_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit Unity metadata reproducibility
        run: python3 scripts/validate-unity-metadata.py
      - id: check
        name: Check source and Unity secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          source_ready=false
          license_ready=false
          personal_license_shape_ready=false
          professional_license_ready=false

          if [ -f Packages/manifest.json ] && [ -f ProjectSettings/ProjectVersion.txt ] && [ -f Assets/ClickDungeon/Simulation/GameSession.cs ] && [ -f Assets/ClickDungeon/Editor/BuildAutomation.cs ]; then
            source_ready=true
          fi

          if [ -n "$UNITY_LICENSE" ]; then
            trimmed_license="${UNITY_LICENSE#"${UNITY_LICENSE%%[![:space:]]*}"}"
            if [ "${#UNITY_LICENSE}" -ge 256 ] && [[ "$trimmed_license" == \<* ]]; then
              personal_license_shape_ready=true
            fi
          fi

          if [ -n "$UNITY_SERIAL" ]; then
            professional_license_ready=true
          fi

          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ "$personal_license_shape_ready" = true ] || [ "$professional_license_ready" = true ]; }; then
            license_ready=true
          fi

          echo "source_ready=$source_ready" >> "$GITHUB_OUTPUT"
          echo "license_ready=$license_ready" >> "$GITHUB_OUTPUT"
          echo "personal_license_shape_ready=$personal_license_shape_ready" >> "$GITHUB_OUTPUT"
          echo "professional_license_ready=$professional_license_ready" >> "$GITHUB_OUTPUT"

          echo "Unity source ready: $source_ready"
          echo "Unity credentials present: $([ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && echo true || echo false)"
          echo "UNITY_LICENSE resembles raw .ulf contents: $personal_license_shape_ready"
          echo "UNITY_SERIAL configured: $professional_license_ready"
          echo "Unity activation inputs ready: $license_ready"

          if [ -n "$UNITY_LICENSE" ] && [ "$personal_license_shape_ready" != true ]; then
            echo "::warning::UNITY_LICENSE is present but does not resemble raw .ulf contents. For GameCI GitHub Personal licensing, store the contents of Unity_lic.ulf, not a file path or extracted serial."
          fi

  editmode:
    needs: preflight
    if: needs.preflight.outputs.source_ready == 'true' && needs.preflight.outputs.license_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          testMode: EditMode
          artifactsPath: test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture Unity import metadata evidence
        if: always()
        shell: bash
        run: |
          mkdir -p .ci/unity-import
          git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages > .ci/unity-import/status.txt || true
          git diff --no-ext-diff -- Assets ProjectSettings Packages > .ci/unity-import/import.diff || true
          python3 scripts/validate-unity-metadata.py > .ci/unity-import/metadata-audit.txt 2>&1 || true
          {
            find Assets -name '*.meta' -type f -print0 2>/dev/null || true
            [ -d ProjectSettings ] && printf '%s\0' ProjectSettings
            [ -f Packages/manifest.json ] && printf '%s\0' Packages/manifest.json
            [ -f Packages/packages-lock.json ] && printf '%s\0' Packages/packages-lock.json
          } | tar --null --files-from=- -czf .ci/unity-import/metadata-snapshot.tar.gz || true
          echo "Captured Unity import status, diff, audit, and canonical metadata snapshot when available."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-editmode-results
          path: |
            test-artifacts
            .ci/unity-import
          if-no-files-found: ignore

  windows:
    needs: editmode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build Windows through ClickDungeon BuildAutomation
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          targetPlatform: StandaloneWindows64
          buildMethod: ClickDungeon.EditorTools.BuildAutomation.BuildWindows
          allowDirtyBuild: false
      - name: Inspect Windows player artifact
        run: python3 scripts/inspect-build-artifact.py windows Builds/Windows
      - name: Capture post-build Unity project delta
        if: always()
        shell: bash
        run: |
          mkdir -p .ci/windows-project-delta
          git status --porcelain=v1 --untracked-files=all -- Assets ProjectSettings Packages > .ci/windows-project-delta/status.txt || true
          git diff --no-ext-diff -- Assets ProjectSettings Packages > .ci/windows-project-delta/tracked.diff || true
          git ls-files -m -o --exclude-standard -z -- Assets ProjectSettings Packages > .ci/windows-project-delta/changed-files.zlist || true
          if [ -s .ci/windows-project-delta/changed-files.zlist ]; then
            tar --null --files-from=.ci/windows-project-delta/changed-files.zlist -czf .ci/windows-project-delta/project-delta.tar.gz || true
          else
            tar -czf .ci/windows-project-delta/project-delta.tar.gz --files-from=/dev/null
          fi
          python3 scripts/validate-unity-metadata.py > .ci/windows-project-delta/metadata-audit.txt 2>&1 || true
          echo "Captured real Unity post-build source, scene, metadata, package, and settings deltas."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-windows-project-delta
          path: .ci/windows-project-delta
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ClickDungeon2-Windows
          path: Builds/Windows
          if-no-files-found: error

  runtime-smoke:
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Download built Windows player
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ClickDungeon2-Windows
          path: Builds/Windows
      - name: Launch and verify built Windows player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $PWD 'runtime-smoke-results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $logPath = Join-Path $results 'player.log'
          $exe = Get-ChildItem -Path 'Builds/Windows' -Filter '*.exe' -File -Recurse |
            Where-Object { $_.Name -notmatch '^UnityCrashHandler' } |
            Select-Object -First 1
          if ($null -eq $exe) { throw 'ClickDungeon2 Windows executable was not found in the downloaded artifact.' }

          Write-Host "Launching built player: $($exe.FullName)"
          $arguments = "-batchmode -nographics -logFile `"$logPath`" -cd2RuntimeSmoke"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(70)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 1
            $process.Refresh()
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $logPath) { Get-Content $logPath }
            throw 'Built Windows player did not complete the runtime smoke within 70 seconds.'
          }

          $exitCode = $process.ExitCode
          if (-not (Test-Path $logPath)) { throw "Built player exited with code $exitCode but did not produce player.log." }
          $logText = Get-Content -Raw $logPath
          Get-Content $logPath

          if ($exitCode -ne 0) { throw "Built Windows player runtime smoke exited with code $exitCode." }
          if ($logText.Contains('[CD2_RUNTIME_SMOKE] FAIL')) { throw 'Built player emitted an explicit runtime-smoke failure marker.' }

          $requiredMarkers = @(
            '[CD2_RUNTIME_SMOKE] START',
            '[CD2_RUNTIME_SMOKE] SCENE Boot',
            '[CD2_RUNTIME_SMOKE] SCENE Main',
            '[CD2_RUNTIME_SMOKE] MAIN_READY',
            '[CD2_RUNTIME_SMOKE] SCENE Game',
            '[CD2_RUNTIME_SMOKE] GAME_READY',
            '[CD2_RUNTIME_SMOKE] PASS'
          )
          foreach ($marker in $requiredMarkers) {
            if (-not $logText.Contains($marker)) { throw "Required runtime marker missing: $marker" }
          }
          Write-Host 'Built Windows player proved Boot -> Main -> Game and initialized GameBootstrap successfully.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unity-runtime-smoke-results
          path: runtime-smoke-results
          if-no-files-found: ignore

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require Android release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Android release signing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p .ci/android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci/android-signing/upload.keystore
          chmod 600 .ci/android-signing/upload.keystore
          echo "CLICKDUNGEON_ANDROID_KEYSTORE_PATH=.ci/android-signing/upload.keystore" >> "$GITHUB_ENV"
          echo "Android upload keystore materialized for this build."
      - name: Build Android AAB through ClickDungeon BuildAutomation
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CLICKDUNGEON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLICKDUNGEON_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLICKDUNGEON_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          targetPlatform: Android
          buildMethod: ClickDungeon.EditorTools.BuildAutomation.BuildAndroid
          allowDirtyBuild: false
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -rf .ci/android-signing
      - name: Inspect Android App Bundle artifact
        run: python3 scripts/inspect-build-artifact.py android Builds/Android
      - name: Verify Android upload certificate
        run: python3 scripts/verify-android-signer.py Builds/Android/ClickDungeon2.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ClickDungeon2-Android-AAB
          path: Builds/Android
          if-no-files-found: error

  webgl:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build WebGL through ClickDungeon BuildAutomation
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.9f1
          targetPlatform: WebGL
          buildMethod: ClickDungeon.EditorTools.BuildAutomation.BuildWeb
          allowDirtyBuild: false
      - name: Inspect WebGL player artifact
        run: python3 scripts/inspect-build-artifact.py webgl Builds/Web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ClickDungeon2-WebGL
          path: Builds/Web
          if-no-files-found: error
