name: Release Readiness Gate

on:
  workflow_dispatch:
    inputs:
      unity_run_id:
        description: Unity Platform CI run ID for this exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify Unity CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_RUN_ID: ${{ inputs.unity_run_id }}
        shell: bash
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UNITY_RUN_ID}")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          workflow_name="$(jq -r '.name' <<<"$run_json")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"

          if [ "$workflow_name" != "Unity Platform CI" ] || [ "$workflow_path" != ".github/workflows/unity-platform-ci.yml" ]; then
            echo "Run $UNITY_RUN_ID is not the required Unity Platform CI workflow: name=$workflow_name path=$workflow_path"
            exit 1
          fi
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Unity CI run SHA $head_sha does not match release SHA $GITHUB_SHA"
            exit 1
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "Unity CI run is not a successful completed run: status=$status conclusion=$conclusion"
            exit 1
          fi

      - name: Download Unity CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_RUN_ID: ${{ inputs.unity_run_id }}
        shell: bash
        run: |
          mkdir -p release-artifacts/ClickDungeon2-Windows
          mkdir -p release-artifacts/ClickDungeon2-Android-AAB
          mkdir -p release-artifacts/ClickDungeon2-WebGL
          gh run download "$UNITY_RUN_ID" --name ClickDungeon2-Windows --dir release-artifacts/ClickDungeon2-Windows
          gh run download "$UNITY_RUN_ID" --name ClickDungeon2-Android-AAB --dir release-artifacts/ClickDungeon2-Android-AAB
          gh run download "$UNITY_RUN_ID" --name ClickDungeon2-WebGL --dir release-artifacts/ClickDungeon2-WebGL

      - name: Verify release artifacts
        run: python scripts/verify-release-artifacts.py release-artifacts

      - name: Validate canonical content
        run: python scripts/validate-content.py

      - name: Run static architecture audit
        run: python scripts/static-audit.py

      - name: Validate runtime art, audio, and provenance
        run: python scripts/validate-assets.py

      - name: Run complete release gate
        run: python scripts/release-check.py

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ClickDungeon2 release readiness'
            echo
            echo '- Canonical content validation attempted'
            echo '- Static architecture audit attempted'
            echo '- Runtime art/audio/provenance validation attempted'
            echo '- Placeholder/store release gate attempted'
            echo
            echo 'This workflow is intentionally manual and may remain blocked during vertical-slice development.'
          } >> "$GITHUB_STEP_SUMMARY"
