name: Apply Runtime Replay Hook

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-runtime-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Add command observer hook safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs')
          s=p.read_text()
          if 'public event Action<GameCommand,CommandResult> CommandExecuted;' not in s:
              old='        public event Action<CommandResult> CommandResolved;\n        public event Action ReturnToMenuRequested;'
              new='        public event Action<CommandResult> CommandResolved;\n        public event Action<GameCommand,CommandResult> CommandExecuted;\n        public event Action ReturnToMenuRequested;'
              if old not in s: raise SystemExit('event insertion point changed')
              s=s.replace(old,new,1)
          if 'CommandExecuted?.Invoke(command,result);' not in s:
              old='            var result=_session.Apply(command);if(!result.Accepted)'
              new='            var result=_session.Apply(command);CommandExecuted?.Invoke(command,result);if(!result.Accepted)'
              if old not in s: raise SystemExit('apply insertion point changed')
              s=s.replace(old,new,1)
          p.write_text(s)
      - name: Verify and commit targeted patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'public event Action<GameCommand,CommandResult> CommandExecuted;' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          grep -F 'CommandExecuted?.Invoke(command,result);' Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          if git diff --quiet; then
            echo 'Runtime replay hook already present.'
            exit 0
          fi
          git config user.name 'ClickDungeon CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Assets/ClickDungeon/Presentation/UI/RuntimeGameUI.cs
          git commit -m 'feat(replay): expose runtime command observer'
          git push origin HEAD:develop
